version: 2
# One weekly PR per app instead of one per package. @cloudflare/workers-types publishes a dated
# release almost every day (the date is the minor version); it's types only (nothing ships), so
# Dependabot leaves it until a new major. Update it by hand with wrangler when it matters.
updates:
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    groups:
      server: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      - dependency-name: '@cloudflare/workers-types'
        update-types: ['version-update:semver-patch', 'version-update:semver-minor']
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    groups:
      web: { patterns: ['*'], update-types: [minor, patch] }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: monthly }, commit-message: { prefix: 'chore(deps)' } }
  - { package-ecosystem: docker, directory: /, schedule: { interval: monthly }, commit-message: { prefix: 'chore(deps)' } }
