# release-please (release-please-config.json): keeps a "chore: release x.y.z" PR open with the
# next version and CHANGELOG.md from Conventional Commits on main. Merging it tags vX.Y.Z and makes
# the GitHub Release. A tag pushed with GITHUB_TOKEN starts no other workflows, so the tag-time
# builds (Docker image, Workers deploy, demo) are called from here instead.
# Repo setting needed: Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests".
name: Release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
  docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
  cloudflare:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/cloudflare.yml
    secrets: inherit
  demo:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/demo.yml
    secrets: inherit
  discord:
    needs: [release-please, docker]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/discord.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
