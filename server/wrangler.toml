name = "kinwall"
main = "src/worker.ts"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat"] # tsdav needs it

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kinwall"
# Placeholder - run `wrangler d1 create kinwall` and paste the returned id here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/docs", "/openapi.json", "/mcp"]

[vars]
# PUBLIC_URL = "https://kinwall.<you>.workers.dev"
SYNC_INTERVAL_MINUTES = "10"
MS_TENANT = "common"
# Set PUBLIC_URL, and secrets (ADMIN_API_KEY, GOOGLE_CLIENT_ID/SECRET, MS_CLIENT_ID/SECRET,
# ENCRYPTION_KEY) via `wrangler secret put <NAME>` rather than committing them here.
# ENCRYPTION_KEY is required on Workers (32 random bytes, base64 - e.g. `openssl rand -base64 32`):
# routes that write accounts/calendars/webhooks secrets return 500 until it's set.
